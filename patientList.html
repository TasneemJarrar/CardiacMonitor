<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients | CardioPulse</title>
  <meta name="description"
    content="View and manage the full cardiac patient roster in CardioPulse. Search, filter, and access individual patient records from a single, streamlined list." />
  <link rel="shortcut icon" href="./assets/icon.ico" type="image/x-icon">

  <meta property="og:title" content="Patients | CardioPulse" />
  <meta property="og:description"
    content="View and manage the full cardiac patient roster in CardioPulse. Search, filter, and access individual patient records from a single, streamlined list." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="CardioPulse" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./src/css/output.css">
</head>

<body data-page="patients"
  class="min-h-screen font-sans bg-gradient-wash text-text-primary dark:bg-gradient-wash-dark dark:text-text-primary-dark transition-all duration-100 ease-in-out">


  <header
    class="w-full bg-gradient-wash dark:bg-gradient-wash-dark border-b sticky top-0 left-0 right-0 z-20 border-border dark:border-border-dark">
    <div class="container mx-auto py-3 px-4 md:px-6 flex justify-between">
      <div class="flex gap-3 items-center">
        <button
          class="menuBtn md:hidden w-10 h-10 flex justify-center items-center hover:bg-primary/10 rounded-lg hover:scale-105 transition-all duration-200 ease-in-out">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="currentColor"
              d="M4 18q-.425 0-.712-.288T3 17t.288-.712T4 16h16q.425 0 .713.288T21 17t-.288.713T20 18zm0-5q-.425 0-.712-.288T3 12t.288-.712T4 11h16q.425 0 .713.288T21 12t-.288.713T20 13zm0-5q-.425 0-.712-.288T3 7t.288-.712T4 6h16q.425 0 .713.288T21 7t-.288.713T20 8z" />
          </svg>
        </button>
        <p class="text-lg font-semibold">CardioPulse</p>
      </div>

      <div class="flex gap-2">
        <button
          class="mode-toggle w-10 h-10 flex justify-center items-center hover:bg-primary/10 rounded-lg hover:scale-105 transition-all duration-200 ease-in-out">
          <i class="fa-regular fa-moon mode-icon text-xl"></i>
        </button>

        <button
          class="notificationBtn w-10 h-10 flex justify-center items-center hover:bg-primary/10 rounded-lg hover:scale-105 transition-all duration-200 ease-in-out">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.268 21a2 2 0 0 0 3.464 0m-10.47-5.674A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
          </svg>
        </button>

        <span class="roleProfile w-10 h-10 rounded-full text-sm text-white flex justify-center items-center"></span>
        <div class=" flex flex-col justify-center">
          <p id="user-name" class="text-sm font-semibold"></p>
          <span id="role" class="text-xs"></span>
        </div>

        <button class="logoutBtn hidden w-10 h-10 md:flex justify-center items-center hover:bg-primary/10 rounded-lg hover:scale-105 transition-all duration-200 ease-in-out">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <g fill="currentColor">
              <path
                d="M5.911 3.038C6.361 3 6.943 3 7.8 3H11a1 1 0 1 0 0-2H7.759c-.805 0-1.47 0-2.01.044c-.563.046-1.08.145-1.565.392a4 4 0 0 0-1.748 1.748c-.247.485-.346 1.002-.392 1.564C2 5.29 2 5.954 2 6.758v10.483c0 .805 0 1.47.044 2.01c.046.563.145 1.08.392 1.565a4 4 0 0 0 1.748 1.748c.485.247 1.002.346 1.564.392C6.29 23 6.954 23 7.758 23H11a1 1 0 1 0 0-2H7.8c-.857 0-1.439 0-1.889-.038c-.438-.035-.663-.1-.819-.18a2 2 0 0 1-.874-.874c-.08-.156-.145-.38-.18-.819C4 18.639 4 18.057 4 17.2V6.8c0-.857 0-1.439.038-1.889c.035-.438.1-.663.18-.819a2 2 0 0 1 .874-.874c.156-.08.38-.145.819-.18" />
              <path
                d="M15.293 6.293a1 1 0 0 1 1.414 0l5 5a1 1 0 0 1 0 1.414l-5 5a1 1 0 0 1-1.414-1.414L18.586 13H10a1 1 0 1 1 0-2h8.586l-3.293-3.293a1 1 0 0 1 0-1.414" />
            </g>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <div class="flex">

    <aside id="sideNav"
      class="hidden md:flex flex-col justify-between group w-20 hover:w-44 transition-all duration-300 min-h-screen bg-surface dark:bg-surface-dark border-r border-border dark:border-border-dark p-4 fixed md:static top-0 left-0 z-30 md:z-10 md:top-16 bottom-0">
      <div class="flex flex-col gap-8 justify-center">
        <div class="flex justify-center items-center w-fit h-fit bg-primary dark:bg-primary-light p-1 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="text-text-primary-dark dark:text-text-primary" width="32"
            height="32" viewBox="0 0 512 512">
            <path fill="currentColor"
              d="M432 272a48.09 48.09 0 0 0-45.25 32h-39.22l-28.35-85.06a16 16 0 0 0-30.56.66l-44.51 155.76l-52.33-314a16 16 0 0 0-31.3-1.25L99.51 304H48a16 16 0 0 0 0 32h64a16 16 0 0 0 15.52-12.12l45.34-181.37l51.36 308.12A16 16 0 0 0 239.1 464h.91a16 16 0 0 0 15.37-11.6l49.8-174.28l15.64 46.94A16 16 0 0 0 336 336h50.75A48 48 0 1 0 432 272" />
          </svg>
          <button id="closeSideNav"
            class="absolute top-4 right-4 w-7 h-7 hidden group-hover:flex md:group-hover:hidden items-center justify-center rounded-lg text-text-muted hover:bg-primary/10 hover:text-primary transition-all duration-200"
            aria-label="Collapse sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M18.3 5.71a1 1 0 0 0-1.42 0L12 10.59 7.12 5.7A1 1 0 0 0 5.7 7.12L10.59 12 5.7 16.88a1 1 0 1 0 1.42 1.42L12 13.41l4.88 4.89a1 1 0 0 0 1.42-1.42L13.41 12l4.89-4.88a1 1 0 0 0 0-1.41Z" />
            </svg>
          </button>
        </div>
        <nav class="sidebarNav flex flex-col gap-4 items-start w-full">
        </nav>
      </div>
      <button
        class="mobileLogoutBtn md:hidden w-10 h-10 flex justify-center items-center hover:bg-primary/10 rounded-lg hover:scale-105 transition-all duration-200 ease-in-out">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
          <g fill="currentColor">
            <path
              d="M5.911 3.038C6.361 3 6.943 3 7.8 3H11a1 1 0 1 0 0-2H7.759c-.805 0-1.47 0-2.01.044c-.563.046-1.08.145-1.565.392a4 4 0 0 0-1.748 1.748c-.247.485-.346 1.002-.392 1.564C2 5.29 2 5.954 2 6.758v10.483c0 .805 0 1.47.044 2.01c.046.563.145 1.08.392 1.565a4 4 0 0 0 1.748 1.748c.485.247 1.002.346 1.564.392C6.29 23 6.954 23 7.758 23H11a1 1 0 1 0 0-2H7.8c-.857 0-1.439 0-1.889-.038c-.438-.035-.663-.1-.819-.18a2 2 0 0 1-.874-.874c-.08-.156-.145-.38-.18-.819C4 18.639 4 18.057 4 17.2V6.8c0-.857 0-1.439.038-1.889c.035-.438.1-.663.18-.819a2 2 0 0 1 .874-.874c.156-.08.38-.145.819-.18" />
            <path
              d="M15.293 6.293a1 1 0 0 1 1.414 0l5 5a1 1 0 0 1 0 1.414l-5 5a1 1 0 0 1-1.414-1.414L18.586 13H10a1 1 0 1 1 0-2h8.586l-3.293-3.293a1 1 0 0 1 0-1.414" />
          </g>
        </svg>
      </button>
    </aside>

    <main id="patients-content" class="flex-1 p-6">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold mb-3">Patients</h1>
        <div id="add-patient-form"
          class=" bg-surface dark:bg-surface-dark border border-border dark:border-border-dark rounded-2xl p-5 mb-4">
          <h3 class="font-semibold mb-3">Add New Patient</h3>
          <form id="patient-form" class="grid grid-cols-2 md:grid-cols-4 gap-3 text-black dark:text-white">
            <input id="patient-name" type="text" placeholder="Full Name" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <input id="patient-age" type="number" placeholder="Age" required min="0" max="120"
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <select id="patient-gender" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm">
              <option value="" disabled selected>Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>

            <input id="patient-phone" type="text" placeholder="Phone" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <select id="patient-blood-type" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm">
              <option value="" disabled selected>Blood Type</option>
              <option>A+</option>
              <option>A-</option>
              <option>B+</option>
              <option>B-</option>
              <option>O+</option>
              <option>O-</option>
              <option>AB+</option>
              <option>AB-</option>
            </select>

            <select id="patient-condition" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm">
              <option value="" disabled selected>Condition</option>
              <option value="Stable">Stable</option>
              <option value="Needs Follow-up">Needs Follow-up</option>
              <option value="Critical">Critical</option>
            </select>

            <input id="patient-diagnosis" type="text" placeholder="Diagnosis" required
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <input id="patient-heart-rate" type="number" placeholder="Heart Rate" required min="30" max="250"
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <input id="patient-blood-pressure" type="text" placeholder="120/80" required pattern="\d{2,3}/\d{2,3}"
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <input id="patient-oxygen" type="number" placeholder="Oxygen %" required min="50" max="100"
              class="px-3 py-2 rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm" />

            <div class="flex gap-2 col-span-2 md:col-span-4">
              <button type="submit"
                class="bg-primary hover:bg-primary-dark text-white text-sm rounded-lg px-4 py-2 transition-colors">Save
                Patient</button>
            </div>
          </form>

          <p id="patient-form-message" class="text-xs mt-2 hidden"></p>
        </div>

        <input id="patient-search" type="text" placeholder="Search by name..."
          class="px-4 py-2 w-full rounded-lg border border-border dark:border-border-dark bg-surface dark:bg-surface-dark text-sm focus:outline-none focus:ring-2 focus:ring-primary text-text-muted dark:text-text-muted-dark" />
      </div>

      <div id="patients-list" class="flex flex-col gap-2">
      </div>
    </main>
  </div>

  <script type="module" src="./src/js/app.js"></script>


</body>

</html>
